<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wira - My Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .glass:hover { border-color: #0ea5e9; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-8">

    <div id="loading" class="mt-20">Memuat data...</div>

    <div id="content" class="hidden w-full max-w-md text-center">
        <div class="mb-10">
            <img id="avatar" src="" class="w-24 h-24 rounded-full mx-auto mb-4 border-2 border-sky-500 p-1 object-cover shadow-2xl shadow-sky-500/20">
            <h1 id="name" class="text-3xl font-extrabold tracking-tight"></h1>
            <p id="bio" class="text-slate-400 mt-2"></p>
        </div>

        <div id="links-container" class="space-y-4"></div>
    </div>

    <script>
        // Pastikan nama file ini SAMA PERSIS dengan file di folder kamu
        fetch('./data.json')
            .then(res => {
                if (!res.ok) throw new Error("Gagal ambil file data.json");
                return res.json();
            })
            .then(data => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                
                document.getElementById('name').textContent = data.name;
                document.getElementById('bio').textContent = data.bio;
                document.getElementById('avatar').src = data.profile_pic;

                const container = document.getElementById('links-container');
                data.links.forEach(link => {
                    container.innerHTML += `
                        <a href="${link.url}" target="_blank" class="glass p-4 rounded-2xl flex items-center space-x-4 transition-all duration-300 transform hover:-translate-y-1 block text-left">
                            <div class="bg-sky-500/10 p-2 rounded-lg">
                                <img src="${link.icon}" class="w-8 h-8 object-contain" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1243/1243420.png'">
                            </div>
                            <div class="flex-1">
                                <h3 class="font-bold text-slate-100">${link.title}</h3>
                                <p class="text-xs text-slate-400 uppercase tracking-wider">${link.desc}</p>
                            </div>
                        </a>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('loading').innerHTML = `<span class="text-red-500 italic">Error: ${err.message}<br>Pastikan file 'data.json' ada di folder yang sama.</span>`;
            });
    </script>
</body>
</html>
